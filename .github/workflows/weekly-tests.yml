name: weekly-tests

on:
  workflow_dispatch:
  schedule:
    - cron: 0 13 * * 1

jobs:
  test_states:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        salt: [3006, 3007]
        os: [22.04, 24.04]
        state:
          - sift.packages.python3
          - sift.tests.gift
          - sift.tests.libewf
          - sift.config.user.pdfs
    container:
      image: docker://ghcr.io/ekristen/cast-tools/saltstack-tester:${{ matrix.os }}-${{ matrix.salt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: test-state
        run: |
          salt-call -l info --file-root . --local --retcode-passthrough --state-output=mixed state.sls ${{ matrix.state }} pillar="{sift_user: root}"
